# Render Blueprint — one web service that serves both the API and the built app (same origin, so the
# auth cookies stay first-party). Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: batchops
    runtime: node
    plan: free
    region: singapore
    # Dev dependencies (TypeScript, Vite, tsup) are needed to build, even though NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string when prompted
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The first admin is created on first start (only while the database has no admin at all).
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Password-reset emails via SMTP (optional — leave EMAIL_PROVIDER empty and reset requests go to the admin).
      # Set it to "smtp" once SMTP_USER and SMTP_PASS are filled in (Gmail: your address + an App Password).
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: APP_URL
        value: https://batch-ops-sigma.vercel.app
